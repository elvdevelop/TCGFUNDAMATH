<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCG FUNDAMATH</title>
<style>
:root{--bg:#101827;--ar:#193D72;--cy:#57D9F5;--rd:#7F2834;--go:#F4C96B;--wh:#F3F5F8;--gr:#8994A7;--ok:#63D9A1;--cw:clamp(82px,12.5vh,124px)}

html,body{height:100%;background:var(--bg);color:var(--wh);font:15px/1.4 system-ui,"Segoe UI",Arial,sans-serif;overflow:hidden;user-select:none}

.scr{display:none;position:absolute;inset:0;overflow:auto}.scr.on{display:flex}
.pg{flex-direction:column;align-items:center;gap:14px;padding:22px;background:radial-gradient(#193D72,#101827)}

.b:hover{filter:brightness(1.1);transform:translateY(-2px)}.b:active{transform:translateY(2px);box-shadow:0 1px 0 #a87f2d}

#menu{align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#193D72,#101827 70%);overflow:hidden}
.mc{position:relative;z-index:2;display:flex;flex-direction:column;gap:12px;align-items:center}.mc .b{width:290px}
h1{font-size:clamp(34px,7vw,76px);font-weight:900;letter-spacing:2px;background:linear-gradient(#fff,var(--cy) 55%,#2a7bd6);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #0a1a44)}
.sl{color:var(--go);letter-spacing:2px;font-style:italic;margin-bottom:12px}

@keyframes drift{to{transform:translateY(-115vh) rotate(180deg)}}
.dc{position:absolute;animation:spin 6s ease-in-out infinite alternate}.d0{left:8%;top:30%}.d1{right:9%;top:20%}.d2{left:66%;bottom:6%}
@keyframes spin{from{transform:rotate(-14deg)}to{transform:rotate(14deg) translateY(-18px)}}
.row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:center}
.hc{width:240px;padding:14px;border-radius:16px;background:#142a52;border:3px solid #fff2;cursor:pointer;text-align:center;transition:.2s}
.hc:hover,.hc.sel{border-color:var(--go);box-shadow:0 0 24px #f4c96b88;transform:translateY(-4px)}
.hv{width:150px;margin:auto;aspect-ratio:5/6}.hv svg,.av svg{width:100%;height:100%}
.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;width:min(1100px,100%)}

code{background:#0b1126;padding:2px 6px;border-radius:6px;color:var(--cy)}

.who{display:flex;gap:10px;align-items:center}.bars{display:flex;flex-direction:column;gap:3px}
.av{width:clamp(56px,9vh,92px);aspect-ratio:5/6;border-radius:12px}

.shk{animation:shk .3s}@keyframes shk{25%{transform:translate(3px,-3px)}75%{transform:translate(-3px,3px)}}
.hp{position:relative;height:18px;width:min(240px,34vw);background:#0007;border-radius:9px;border:2px solid #fff4;overflow:hidden}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#63D9A1,#c4f09a);transition:width .5s}.r1 .hp i{background:linear-gradient(90deg,#ff6b6b,#ffb199)}
.hp span{position:absolute;inset:0;text-align:center;font:700 12px/14px sans-serif}
.en small{display:block;font-size:11px}.en u{display:inline-block;width:11px;height:11px;margin:2px 3px 0 0;border-radius:3px;transform:rotate(45deg);background:#fff2}.en u.on{background:var(--cy);box-shadow:0 0 6px var(--cy)}
.slots,.piles{display:flex;gap:8px;align-items:center}
.pile{width:calc(var(--cw)*.62);aspect-ratio:5/7;border-radius:8px;border:2px solid var(--go);background:repeating-linear-gradient(45deg,#1b2f5a 0 6px,#122244 6px 12px);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;box-shadow:3px 3px 0 #0006,6px 6px 0 #0004}.pile b{font-size:20px;color:var(--go)}
.mid{flex:1.25 1 0;min-height:0;display:flex;align-items:center;justify-content:center;gap:5vw;position:relative;perspective:700px;background:radial-gradient(#1b4a8a,#0c1530)}
.plane{position:absolute;inset:6% 8%;transform:rotateX(38deg);border:2px solid #57D9F566;border-radius:20px;background:repeating-linear-gradient(60deg,#57d9f518 0 2px,transparent 2px 40px),repeating-linear-gradient(120deg,#57d9f518 0 2px,transparent 2px 40px),radial-gradient(circle,#57d9f533,transparent 60%)}
.main{width:var(--cw);aspect-ratio:5/7;border:2px dashed #ffffff44;border-radius:10px;display:grid;place-items:center;font-size:11px;color:var(--gr);position:relative;z-index:1;text-align:center}
.main .card{opacity:.95}.glow{box-shadow:0 0 26px 6px var(--go)}
.tb{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:3}.tb .b{padding:5px 10px;font-size:11px}
#info{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 14px;background:#0b1126;font-size:13px;min-height:46px}
#info span:last-child{display:flex;gap:8px;flex:none}#info .b{padding:7px 14px}
#hand{display:flex;gap:6px;justify-content:center;padding:26px 8px 10px;overflow-x:auto;min-height:calc(var(--cw)*1.4 + 40px);background:linear-gradient(#0c1530,#101827);align-items:flex-end}
.card{--tc:#57D9F5;width:var(--cw);aspect-ratio:5/7;flex:none;border-radius:10px;border:2px solid var(--tc);background:linear-gradient(160deg,#27427a,#0f1a33);position:relative;display:flex;flex-direction:column;align-items:center;padding:4px;text-align:center;box-shadow:0 6px 12px #0008;transition:transform .2s,box-shadow .2s;overflow:hidden}
.ta{--tc:#ff6b6b}.th{--tc:#63D9A1}.tk{--tc:#F4C96B}.ts{--tc:#c79bff}
.card[data-a]{cursor:pointer}.card[data-a]:hover{transform:translateY(-8px)}
.card.sel{transform:translateY(-22px) scale(1.1);box-shadow:0 0 22px var(--tc);z-index:2}
.cc{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--go);color:#101827;font:900 13px/22px sans-serif;text-align:center}
.ci{width:50%;aspect-ratio:1;margin:12% 0 2px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(var(--tc),#0000 75%);font-size:calc(var(--cw)*.3);font-weight:900;text-shadow:0 0 8px #000}
.card b{font-size:calc(var(--cw)*.105);line-height:1.1}.card em{font-size:calc(var(--cw)*.085);color:var(--tc);font-style:normal}
.card p{font-size:calc(var(--cw)*.083);color:#c9d3e6;margin-top:auto;line-height:1.15}
.card.sm{width:calc(var(--cw)*.5);padding:2px}.sm p,.sm em{display:none}.sm b{font-size:8px}.sm .ci{font-size:16px;margin-top:8px}.sm .cc{width:15px;height:15px;font-size:9px;line-height:15px}
.ph{border-style:dashed;color:var(--gr);font-size:9px;justify-content:center;background:none;box-shadow:none}
.off{filter:grayscale(.8) brightness(.7)}.off::after{content:"Energi kurang";position:absolute;bottom:3px;left:0;right:0;font-size:9px;background:#000b;color:var(--go)}
.fly{position:fixed;z-index:60;pointer-events:none}.fly .card{width:100%;height:100%;aspect-ratio:auto}
.pj{position:fixed;left:0;top:0;width:28px;height:28px;border-radius:50%;background:radial-gradient(#fff,var(--cy) 50%,transparent 72%);z-index:50;pointer-events:none}.pj.p1{background:radial-gradient(#fff,#ff6b6b 50%,transparent 72%)}
.fl{position:fixed;font-weight:900;font-size:28px;text-shadow:0 2px 6px #000;animation:rise 1s forwards;z-index:60;pointer-events:none;white-space:nowrap}
.fl.dm{color:#ff6b6b}.fl.sh{color:var(--cy);font-size:18px;margin-top:30px}.fl.hl{color:var(--ok)}.fl.en{color:var(--go);font-size:20px}
@keyframes rise{from{transform:translate(-50%,0)}to{transform:translate(-50%,-55px);opacity:0}}
#ban{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.8);padding:10px 28px;background:#0b1126ee;border:2px solid var(--go);border-radius:14px;font-weight:900;font-size:clamp(16px,2.6vw,28px);color:var(--go);opacity:0;pointer-events:none;transition:.25s;z-index:70;text-align:center}#ban.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#ov{display:none;position:fixed;inset:0;z-index:40;justify-content:center;padding:10px}#ov.top{display:flex;align-items:flex-start}#ov.mid{display:flex;align-items:center}
.bk{position:absolute;inset:0;background:#050a1966}.mid .bk{background:#050a19aa}.win .bk{background:radial-gradient(#f4c96b77,#050a19dd)}
.pn{position:relative;background:linear-gradient(#1c3668,#101c3a);border:2px solid var(--cy);border-radius:16px;padding:16px 20px;width:min(620px,94vw);max-height:92vh;overflow:auto;box-shadow:0 0 30px #57d9f566;animation:pop .25s;user-select:text}
.pn.w{border-color:var(--go);box-shadow:0 0 60px #f4c96bcc}.pn.l{border-color:var(--gr)}@keyframes pop{from{transform:scale(.9);opacity:0}}
.pn h3{color:var(--go);letter-spacing:1px;margin-bottom:6px}.pn h4{color:var(--cy)}.pn p{margin:5px 0}.qt{font-size:22px;font-weight:700;margin:10px 0}.rk{color:var(--gr);font-size:13px}
.pn ol{padding-left:22px;margin:6px 0}.pn li{margin:4px 0}.pn input{width:100%;padding:12px;border-radius:10px;border:2px solid var(--cy);background:#0b1126;color:#fff;font-size:20px;margin:8px 0}
.bt{display:flex;gap:10px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}#msg{color:var(--go);min-height:20px}.bd{color:#ff9aa8}.gd{color:var(--ok)}
body.noanim *{animation:none!important;transition:none!important}
@media(max-width:760px){:root{--cw:clamp(70px,11vh,100px)}.rg{padding:4px 8px;gap:6px}.hp{width:30vw}#info{font-size:11px}.slots{display:none}}
</style></head><body>
<div id="ov"></div><div id="ban"></div>
<section id="menu" class="scr on"><div class="deco" id="deco"></div><div class="mc"><h1>TCG FUNDAMATH</h1><p class="sl">Susun Strategi, Taklukkan Angka!</p>
<button class="b" data-a="go" data-v="char">MULAI BERMAIN</button><button class="b s" data-a="help">CARA BERMAIN</button><button class="b s" data-a="go" data-v="lib">PERPUSTAKAAN MATERI</button><button class="b s" data-a="go" data-v="prog">PROGRES BELAJAR</button><button class="b s" data-a="set">PENGATURAN</button></div></section>
<section id="char" class="scr pg"></section><section id="diff" class="scr pg"></section><section id="game" class="scr"></section><section id="lib" class="scr pg"></section><section id="prog" class="scr pg"></section>
<script>
//QB
const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pk=a=>a[r(0,a.length-1)];
const SN=['Dasar Aritmetika','Dasar Aljabar','Dasar Geometri','Fungsi dan Pola','Logika dan Soal Cerita'];
const S=[[],[],[],[],[]],T=(s,n,k,f,g)=>S[s].push({s,n,k,f,g});
// Tahap 1
T(0,'Penjumlahan dan Pengurangan','Hitung dari kiri ke kanan, satu langkah setiap kali.','a + b − c',()=>{const a=r(20,90),b=r(10,60),c=r(5,40);return[`${a} + ${b} − ${c} = ?`,a+b-c,[`Jumlahkan dulu bilangan pertama dan kedua: ${a} + ${b} = ${a+b}.`,`Kurangi hasilnya dengan ${c} karena operasi dihitung dari kiri: ${a+b} − ${c} = ${a+b-c}.`]]});
T(0,'Perkalian dan Pembagian','Perkalian dan pembagian dikerjakan dari kiri ke kanan.','a ÷ b × c',()=>{const x=r(2,9),y=r(2,9),z=r(2,9);return[`${x*y} ÷ ${y} × ${z} = ?`,x*z,[`Kerjakan dari kiri: ${x*y} ÷ ${y} = ${x}.`,`Lanjutkan dengan perkalian: ${x} × ${z} = ${x*z}.`]]});
T(0,'Urutan Operasi','Perkalian dan pembagian dikerjakan lebih dulu daripada penjumlahan dan pengurangan.','× ÷ dahulu, baru + −',()=>{const a=r(5,30),b=r(2,9),c=r(2,9),d=r(1,20);return[`${a} + ${b} × ${c} − ${d} = ?`,a+b*c-d,[`Kerjakan perkalian lebih dulu: ${b} × ${c} = ${b*c}.`,`Sekarang bentuknya ${a} + ${b*c} − ${d}. Jumlahkan: ${a+b*c}.`,`Kurangi: ${a+b*c} − ${d} = ${a+b*c-d}.`]]});
T(0,'Bilangan Positif dan Negatif','Mengurangi bilangan negatif sama dengan menambah bilangan positif.','a − (−b) = a + b',()=>{const a=r(2,15),b=r(2,15),c=r(2,15);return[`${a} − (−${b}) + (−${c}) = ?`,a+b-c,[`Mengurangi −${b} sama dengan menambah ${b}: ${a} + ${b} = ${a+b}.`,`Menambah (−${c}) sama dengan mengurangi ${c}: ${a+b} − ${c} = ${a+b-c}.`]]});
T(0,'Pecahan','Pecahan dari suatu bilangan: bagi dengan penyebut, lalu kalikan dengan pembilang.','a/b dari n = n ÷ b × a',()=>{const b=r(2,6),a=r(1,b-1),k=r(2,9),n=b*k;return[`${a}/${b} dari ${n} = ?`,k*a,[`Bagi ${n} dengan penyebut ${b}: ${n} ÷ ${b} = ${k}.`,`Kalikan dengan pembilang ${a}: ${k} × ${a} = ${k*a}.`]]});
T(0,'Desimal dan Persentase','Persen berarti per seratus: p% dari n = p ÷ 100 × n.','p% dari n = p × n ÷ 100',()=>{const p=5*r(1,10),n=20*r(2,10);return[`${p}% dari ${n} = ?`,p*n/100,[`Ubah ${p}% menjadi pecahan ${p}/100.`,`Hitung ${p} × ${n} = ${p*n}, lalu bagi 100: ${p*n/100}.`]]});
T(0,'Rasio dan Perbandingan','Rasio a : b membagi total menjadi a + b bagian yang sama besar.','Bagian A = a ÷ (a + b) × total',()=>{const a=r(1,5),b=r(2,6),k=r(2,9);return[`Kelereng Dina dan Edo berbanding ${a} : ${b}. Jumlahnya ${(a+b)*k}. Berapa kelereng Dina?`,a*k,[`Jumlah bagian: ${a} + ${b} = ${a+b}.`,`Satu bagian = ${(a+b)*k} ÷ ${a+b} = ${k}.`,`Kelereng Dina = ${a} × ${k} = ${a*k}.`]]});
T(0,'Rata-rata','Rata-rata = jumlah semua nilai dibagi banyak nilai.','Rata-rata = jumlah ÷ banyak data',()=>{const m=r(60,90),d=r(1,9);return[`Tiga nilai ulangan: ${m-d}, ${m}, dan ${m+d}. Berapa rata-ratanya?`,m,[`Jumlahkan semua nilai: ${m-d} + ${m} + ${m+d} = ${3*m}.`,`Bagi dengan banyak data (3): ${3*m} ÷ 3 = ${m}.`]]});
// Tahap 2
T(1,'Bentuk Aljabar dan Variabel','Variabel adalah huruf pengganti bilangan. Ganti huruf dengan nilainya, lalu hitung.','ax + b dengan x diberi nilai',()=>{const a=r(2,9),b=r(1,15),x=r(2,9);return[`Jika x = ${x}, berapa nilai ${a}x + ${b}?`,a*x+b,[`Ganti x dengan ${x}: ${a} × ${x} + ${b}.`,`Kalikan dulu: ${a*x}, lalu tambah ${b}: ${a*x+b}.`]]});
T(1,'Suku Sejenis','Suku sejenis punya huruf yang sama, jadi koefisiennya bisa dijumlahkan atau dikurangkan.','ax + bx = (a + b)x',()=>{const a=r(3,9),b=r(2,9),c=r(1,8),d=r(1,9);return[`Sederhanakan ${a}x + ${b}y − ${c}x + ${d}x. Berapa koefisien x?`,a-c+d,[`Suku sejenis dengan x: ${a}x, −${c}x, dan ${d}x.`,`Jumlahkan koefisiennya: ${a} − ${c} + ${d} = ${a-c+d}.`]]});
T(1,'Sifat Distributif','Kalikan bilangan di luar kurung ke setiap suku di dalam kurung.','a(bx + c) = abx + ac',()=>{const a=r(2,6),b=r(2,5),c=r(1,9),x=r(1,6);return[`Jika x = ${x}, berapa nilai ${a}(${b}x + ${c})?`,a*(b*x+c),[`Kalikan ${a} ke setiap suku: ${a*b}x + ${a*c}.`,`Ganti x = ${x}: ${a*b} × ${x} + ${a*c} = ${a*b*x} + ${a*c}.`,`Hasilnya ${a*b*x+a*c}.`]]});
T(1,'Persamaan Linear Satu Variabel','Lakukan operasi yang sama pada kedua sisi agar x berdiri sendiri.','ax + b = c → x = (c − b) ÷ a',()=>{const a=r(2,9),x=r(1,12),b=r(1,20),c=a*x+b;return[`${a}x + ${b} = ${c}. Berapa nilai x?`,x,[`Kurangi kedua sisi dengan ${b}: ${a}x = ${c} − ${b} = ${c-b}.`,`Bagi kedua sisi dengan ${a}: x = ${c-b} ÷ ${a} = ${x}.`]]});
T(1,'Variabel di Dua Sisi','Kumpulkan suku x di satu sisi dan bilangan biasa di sisi lain.','ax + b = cx + d',()=>{const c=r(1,5),a=c+r(1,5),x=r(1,10),b=r(1,15),d=b+(a-c)*x;return[`${a}x + ${b} = ${c}x + ${d}. Berapa nilai x?`,x,[`Pindahkan ${c}x ke kiri: ${a-c}x + ${b} = ${d}.`,`Kurangi ${b}: ${a-c}x = ${d-b}.`,`Bagi ${a-c}: x = ${d-b} ÷ ${a-c} = ${x}.`]]});
T(1,'SPLDV dengan Eliminasi','Jumlahkan dua persamaan agar salah satu variabel hilang (eliminasi).','x + y = S dan x − y = D → 2x = S + D',()=>{const x=r(3,15),y=r(1,x-1);return[`x + y = ${x+y} dan x − y = ${x-y}. Berapa nilai x?`,x,[`Jumlahkan kedua persamaan sehingga y hilang: 2x = ${x+y} + ${x-y} = ${2*x}.`,`Bagi dengan 2: x = ${2*x} ÷ 2 = ${x}.`]]});
T(1,'SPLDV dengan Substitusi','Temukan satu variabel, lalu masukkan nilainya ke persamaan lain (substitusi).','2x + y = A dan x + y = B',()=>{const x=r(1,9),y=r(1,9);return[`2x + y = ${2*x+y} dan x + y = ${x+y}. Berapa nilai y?`,y,[`Kurangkan persamaan kedua dari yang pertama: x = ${2*x+y} − ${x+y} = ${x}.`,`Substitusikan x = ${x} ke x + y = ${x+y}: y = ${x+y} − ${x} = ${y}.`]]});
T(1,'Pangkat dan Akar','Pangkat dua berarti kali diri sendiri. Akar kuadrat adalah kebalikannya.','a² + √(b²) = a × a + b',()=>{const a=r(2,12),b=r(2,12);return[`${a}² + √${b*b} = ?`,a*a+b,[`${a}² = ${a} × ${a} = ${a*a}.`,`√${b*b} = ${b} karena ${b} × ${b} = ${b*b}.`,`Jumlahkan: ${a*a} + ${b} = ${a*a+b}.`]]});
// Tahap 3
T(2,'Keliling Persegi Panjang','Keliling adalah jumlah panjang semua sisi.','K = 2 × (p + l)',()=>{const p=r(6,20),l=r(2,p-1);return[`Persegi panjang berukuran ${p} cm × ${l} cm. Berapa kelilingnya (cm)?`,2*(p+l),[`Jumlahkan panjang dan lebar: ${p} + ${l} = ${p+l}.`,`Kalikan 2: 2 × ${p+l} = ${2*(p+l)}.`]]});
T(2,'Luas Persegi Panjang','Luas adalah banyak petak satuan yang menutupi bangun.','L = p × l',()=>{const p=r(5,20),l=r(3,15);return[`Kebun berbentuk persegi panjang ${p} m × ${l} m. Berapa luasnya (m²)?`,p*l,[`Luas = panjang × lebar.`,`${p} × ${l} = ${p*l}.`]]});
T(2,'Luas Segitiga','Luas segitiga adalah setengah dari alas kali tinggi.','L = ½ × a × t',()=>{const a=r(3,20),t=2*r(2,10);return[`Alas segitiga ${a} cm dan tingginya ${t} cm. Berapa luasnya (cm²)?`,a*t/2,[`Kalikan alas dan tinggi: ${a} × ${t} = ${a*t}.`,`Ambil setengahnya: ${a*t} ÷ 2 = ${a*t/2}.`]]});
T(2,'Persegi','Persegi punya empat sisi sama panjang.','s = K ÷ 4, L = s × s',()=>{const s=r(3,15);return[`Keliling sebuah persegi ${4*s} cm. Berapa luasnya (cm²)?`,s*s,[`Sisi = keliling ÷ 4 = ${4*s} ÷ 4 = ${s} cm.`,`Luas = ${s} × ${s} = ${s*s}.`]]});
T(2,'Pythagoras: Sisi Miring','Pada segitiga siku-siku, kuadrat sisi miring sama dengan jumlah kuadrat dua sisi lainnya.','c² = a² + b²',()=>{const[a,b,c]=pk([[3,4,5],[5,12,13],[8,15,17],[7,24,25]]),k=r(1,3);return[`Segitiga siku-siku punya sisi tegak ${a*k} cm dan ${b*k} cm. Berapa panjang sisi miringnya (cm)?`,c*k,[`c² = ${a*k}² + ${b*k}² = ${a*a*k*k} + ${b*b*k*k} = ${c*c*k*k}.`,`c = √${c*c*k*k} = ${c*k}.`]]});
T(2,'Pythagoras: Sisi Tegak','Sisi tegak dicari dengan mengurangkan kuadrat sisi yang diketahui dari kuadrat sisi miring.','a² = c² − b²',()=>{const[a,b,c]=pk([[3,4,5],[5,12,13],[8,15,17],[7,24,25]]),k=r(1,3);return[`Sisi miring ${c*k} cm dan salah satu sisi tegak ${b*k} cm. Berapa panjang sisi tegak yang lain (cm)?`,a*k,[`a² = ${c*k}² − ${b*k}² = ${c*c*k*k} − ${b*b*k*k} = ${a*a*k*k}.`,`a = √${a*a*k*k} = ${a*k}.`]]});
T(2,'Volume Balok','Volume menyatakan isi ruang dalam bangun.','V = p × l × t',()=>{const p=r(3,12),l=r(2,8),t=r(2,9);return[`Balok berukuran ${p} cm × ${l} cm × ${t} cm. Berapa volumenya (cm³)?`,p*l*t,[`Kalikan panjang dan lebar: ${p} × ${l} = ${p*l}.`,`Kalikan dengan tinggi: ${p*l} × ${t} = ${p*l*t}.`]]});
T(2,'Volume Kubus','Kubus punya rusuk yang semuanya sama panjang.','V = s × s × s',()=>{const s=r(2,9);return[`Rusuk sebuah kubus ${s} cm. Berapa volumenya (cm³)?`,s**3,[`${s} × ${s} = ${s*s}.`,`${s*s} × ${s} = ${s**3}.`]]});
// Tahap 4
T(3,'Pola Bilangan','Pola bertambah dengan selisih tetap. Tambahkan selisih itu ke suku terakhir.','Suku berikutnya = suku terakhir + beda',()=>{const a=r(1,15),b=r(2,9);return[`Pola: ${a}, ${a+b}, ${a+2*b}, ${a+3*b}, ... Berapa suku berikutnya?`,a+4*b,[`Selisih tiap suku: ${a+b} − ${a} = ${b}.`,`Tambahkan ke suku terakhir: ${a+3*b} + ${b} = ${a+4*b}.`]]});
T(3,'Suku ke-n Barisan Aritmetika','Suku ke-n didapat dari suku pertama ditambah (n − 1) kali beda.','Un = a + (n − 1) × b',()=>{const a=r(1,10),b=r(2,8),n=r(6,12);return[`Suku pertama ${a} dan beda ${b}. Berapa suku ke-${n}?`,a+(n-1)*b,[`Un = ${a} + (${n} − 1) × ${b} = ${a} + ${(n-1)*b}.`,`Hasilnya ${a+(n-1)*b}.`]]});
T(3,'Beda Barisan Aritmetika','Dua suku yang berjarak k suku berselisih k kali beda.','b = (Un − Um) ÷ (n − m)',()=>{const a=r(1,10),b=r(2,8);return[`Pada barisan aritmetika, U3 = ${a+2*b} dan U7 = ${a+6*b}. Berapa bedanya?`,b,[`Dari suku ke-3 ke suku ke-7 ada 4 kali tambah beda.`,`4b = ${a+6*b} − ${a+2*b} = ${4*b}, jadi b = ${4*b} ÷ 4 = ${b}.`]]});
T(3,'Jumlah n Suku Pertama','Jumlah suku pertama dihitung dengan rumus deret aritmetika.','Sn = n ÷ 2 × (2a + (n − 1)b)',()=>{const a=r(1,8),b=r(1,5),n=2*r(2,5),s=n/2*(2*a+(n-1)*b);return[`Suku pertama ${a} dan beda ${b}. Berapa jumlah ${n} suku pertama?`,s,[`Sn = ${n}/2 × (2 × ${a} + ${n-1} × ${b}).`,`Isi kurung: ${2*a} + ${(n-1)*b} = ${2*a+(n-1)*b}.`,`Kalikan dengan ${n/2}: ${s}.`]]});
T(3,'Fungsi Linear','Fungsi linear mengubah x menjadi ax + b. Ganti x dengan nilai yang diberikan.','f(x) = ax + b',()=>{const a=r(2,7),b=r(1,9),x=r(2,9);return[`f(x) = ${a}x − ${b}. Berapa f(${x})?`,a*x-b,[`Ganti x dengan ${x}: ${a} × ${x} − ${b}.`,`${a*x} − ${b} = ${a*x-b}.`]]});
T(3,'Substitusi Nilai Fungsi','Jika nilai fungsi diketahui, selesaikan persamaannya untuk mencari x.','ax + b = c',()=>{const a=r(2,6),b=r(1,9),x=r(2,10),c=a*x+b;return[`f(x) = ${a}x + ${b}. Untuk x berapa f(x) = ${c}?`,x,[`Tulis ${a}x + ${b} = ${c}.`,`${a}x = ${c} − ${b} = ${c-b}.`,`x = ${c-b} ÷ ${a} = ${x}.`]]});
T(3,'Mencari Fungsi dari Dua Nilai','Dua nilai fungsi cukup untuk menemukan a dan b pada f(x) = ax + b.','a = selisih f ÷ selisih x',()=>{const a=r(2,6),b=r(1,9);return[`f(x) = ax + b, f(1) = ${a+b}, dan f(3) = ${3*a+b}. Berapa f(5)?`,5*a+b,[`Selisih nilai ${3*a+b} − ${a+b} = ${2*a} untuk selisih x sebesar 2, jadi a = ${a}.`,`Dari f(1): ${a} + b = ${a+b}, jadi b = ${b}.`,`f(5) = ${a} × 5 + ${b} = ${5*a+b}.`]]});
T(3,'Hubungan Antarvariabel','Banyak masalah punya biaya tetap ditambah biaya per satuan waktu.','Biaya = tetap + tarif × waktu',()=>{const a=r(3,9),b=r(5,20),t=r(3,8);return[`Sewa sepeda: biaya tetap ${b} ribu rupiah ditambah ${a} ribu rupiah per jam. Berapa ribu rupiah biaya ${t} jam?`,b+a*t,[`Biaya untuk ${t} jam: ${a} × ${t} = ${a*t}.`,`Tambahkan biaya tetap: ${a*t} + ${b} = ${b+a*t}.`]]});
// Tahap 5
T(4,'Soal Cerita: Umur','Ubah cerita menjadi persamaan, lalu selesaikan.','x + kx = (k + 1)x',()=>{const a=r(5,15),k=r(2,4);return[`Umur ayah ${k} kali umur Ani. Jumlah umur mereka ${(k+1)*a} tahun. Berapa umur Ani?`,a,[`Misalkan umur Ani = x, maka umur ayah = ${k}x.`,`Jumlahnya: x + ${k}x = ${k+1}x = ${(k+1)*a}.`,`x = ${(k+1)*a} ÷ ${k+1} = ${a}.`]]});
T(4,'Rasio dalam Kehidupan Sehari-hari','Jika jumlah dikalikan, semua bahan ikut dikalikan dengan bilangan yang sama.','a₁ ÷ b₁ = a₂ ÷ b₂',()=>{const a=r(2,5),b=r(2,6),k=r(2,5);return[`Resep untuk ${a} orang memakai ${b} gelas tepung. Berapa gelas tepung untuk ${a*k} orang?`,b*k,[`Jumlah orang menjadi ${a*k} ÷ ${a} = ${k} kali lipat.`,`Tepung juga ${k} kali lipat: ${b} × ${k} = ${b*k}.`]]});
T(4,'Kecepatan, Jarak, dan Waktu','Kecepatan menyatakan jarak yang ditempuh dalam satu satuan waktu.','v = s ÷ t',()=>{const v=r(30,80),t=r(2,6);return[`Bus menempuh ${v*t} km dalam ${t} jam dengan kecepatan tetap. Berapa kecepatannya (km/jam)?`,v,[`Kecepatan = jarak ÷ waktu.`,`${v*t} ÷ ${t} = ${v}.`]]});
T(4,'Soal Cerita: Belanja','Hitung dulu total pengeluaran, lalu kurangkan dari uang yang dimiliki.','Sisa = uang − jumlah × harga',()=>{const n=r(2,6),h=r(3,9),u=n*h+r(5,30);return[`Rani punya ${u} ribu rupiah. Ia membeli ${n} buku seharga ${h} ribu rupiah per buku. Berapa ribu rupiah sisa uangnya?`,u-n*h,[`Total belanja: ${n} × ${h} = ${n*h} ribu.`,`Sisa uang: ${u} − ${n*h} = ${u-n*h} ribu.`]]});
T(4,'Membaca Data','Baca semua angka dengan teliti, lalu bandingkan.','Selisih = terbesar − terkecil',()=>{const a=r(10,40),b=r(41,70),c=r(20,60),x=Math.max(a,b,c),n=Math.min(a,b,c);return[`Penjualan roti: Senin ${a}, Selasa ${b}, Rabu ${c}. Berapa selisih penjualan tertinggi dan terendah?`,x-n,[`Terbesar ${x} dan terkecil ${n}.`,`Selisihnya: ${x} − ${n} = ${x-n}.`]]});
T(4,'Penyelesaian Masalah Bertahap','Pecah masalah besar menjadi langkah-langkah kecil.','Waktu = (awal − akhir) ÷ laju',()=>{const y=r(2,9),m=r(3,12),z=r(10,60),x=z+y*m;return[`Tangki berisi ${x} liter air dan bocor ${y} liter tiap menit. Setelah berapa menit sisa airnya ${z} liter?`,m,[`Air yang harus berkurang: ${x} − ${z} = ${x-z} liter.`,`Waktunya: ${x-z} ÷ ${y} = ${m} menit.`]]});
T(4,'Persentase dalam Soal Cerita','Diskon p% berarti potongan sebesar p% dari harga awal.','Bayar = harga − p% × harga',()=>{const k=r(2,10),m=r(1,4),h=20*k,p=5*m;return[`Harga sepatu ${h} ribu rupiah dan didiskon ${p}%. Berapa ribu rupiah yang harus dibayar?`,h-k*m,[`Potongan = ${p}% × ${h} = ${p*h/100} ribu.`,`Harga bayar = ${h} − ${k*m} = ${h-k*m} ribu.`]]});
T(4,'Soal Cerita SPLDV','Beri huruf pada harga yang dicari, lalu pakai persamaan.','2b + p = A dan b + p = B → b = A − B',()=>{const b=r(4,12),p=r(2,9);return[`2 buku dan 1 pulpen harganya ${2*b+p} ribu rupiah. 1 buku dan 1 pulpen harganya ${b+p} ribu rupiah. Berapa ribu rupiah harga 1 buku?`,b,[`Misalkan buku = b dan pulpen = p: 2b + p = ${2*b+p} dan b + p = ${b+p}.`,`Kurangkan kedua persamaan: b = ${2*b+p} − ${b+p} = ${b}.`]]});

$('hand').innerHTML=G.hd[0].map((id,k)=>CH(CD[id],{k,s:k==G.sel,off:CD[id].c>G.en[0]})).join('');
const c=G.sel>=0?CD[G.hd[0][G.sel]]:null;
$('info').innerHTML=`<span>${G.over?'Pertandingan selesai.':G.turn?'Giliran lawan…':c?`<b>${c.n}</b> — ${desc(c)} ${risk(c)} Biaya ${c.c} energi.`:`Giliranmu · Putaran ${G.rd} · Pilih kartu di tanganmu.`}</span><span>${c?'<button class=b data-a=use>GUNAKAN KARTU</button>':''}<button class="b s" data-a=end>AKHIRI GILIRAN</button></span>`}
async function startTurn(s){G.turn=s;if(!s)G.rd++;G.sh[s]=0;G.sel=-1;G.en[s]=Math.max(0,Math.min(10,3+((G.rd-1)>>1))-G.pen[s]);G.pen[s]=0;draw(s,1);render();toast(s?'GILIRAN LAWAN':'GILIRANMU');await W(900);if(s)await ai();else{G.busy=false;render()}}
function chk(){if(G.hp[0]>0&&G.hp[1]>0)return false;if(!G.over){G.over=1;G.busy=true;const e=EP;setTimeout(()=>e==EP&&finish(),600)}return true}
async function hit(t,n,p){let a=0;if(!p&&G.sh[t]){a=Math.min(G.sh[t],n);G.sh[t]-=a;n-=a}G.hp[t]-=n;fl(t,n?'-'+n:'Terblokir',n?'dm':'sh');if(a&&!G.sh[t])fl(t,'Perisai pecah','sh');ring(t,'hit');$('arena').classList.add('shk');setTimeout(()=>$('arena').classList.remove('shk'),300);snd('hit');render();await W(380)}
async function eff(s,c,ok){const o=1-s,f=v=>ok?v:c.t=='k'||c.t=='s'?0:v>>1,d=f(c.d),sh=f(c.sh),hl=f(c.hl),dr=f(c.dr),en=f(c.en);
if(!ok&&c.self)await hit(s,c.self,1);
for(let i=0;i<c.h&&d;i++){await proj(s,o);await hit(o,d,c.p)}
if(sh){G.sh[s]=Math.min(20,G.sh[s]+sh);fl(s,'+'+sh+' perisai','sh');ring(s,'sh');snd('sh');render();await W(400)}
if(hl){const n=Math.min(hl,30-G.hp[s]);G.hp[s]+=n;fl(s,'+'+n+' HP','hl');ring(s,'hl');snd('ok');render();await W(400)}
if(en){G.en[s]=Math.min(10,G.en[s]+en);fl(s,'+'+en+' energi','en');render();await W(300)}
if(dr){draw(s,dr);fl(s,'Tarik kartu','en');render();await W(300)}
if(ok&&c.pen){G.pen[o]+=c.pen;fl(o,'−'+c.pen+' energi','dm');await W(300)}
if(ok&&c.cyc){G.dc[s].push(...G.hd[s]);G.hd[s]=[];draw(s,c.cyc);render();await W(300)}
if(!ok&&!d&&!sh&&!hl&&!en&&!dr&&!c.self)fl(s,'Gagal','dm')}
async function playCard(s,k,ok){const id=G.hd[s][k],c=CD[id],from=rc(s?$('dk1'):$('hand').children[k]);
G.hd[s].splice(k,1);G.en[s]-=c.c;G.sel=-1;render();lg(`${s?'Lawan':'Kamu'} memakai ${c.n}${ok?'':' (belum tepat)'}.`);
snd('use');await fly(CH(c),from,$('m'+s));
if(G.act[s]!=null)G.hs[s]=[G.act[s],...G.hs[s]].slice(0,3);
G.act[s]=id;render();$('m'+s).classList.add('glow');setTimeout(()=>$('m'+s).classList.remove('glow'),800);
await eff(s,c,ok);await W(250);
await fly(CH(c),$('m'+s),$('dc'+s));G.dc[s].push(id);render()}
/* ===== Lawan AI ===== */
const sc=c=>{const d=G.diff,hp=G.hp[1],e=G.en[1];if(!d)return Math.random();
let v=c.d*c.h+Math.min(c.hl,30-hp)*(hp<14?2:.7)+c.sh*(hp<12?1.4:.6)+c.dr*1.2+Math.min(c.en,10-e)*1.2+c.pen*1.5-c.self*(d>1&&hp<=c.self+4?99:1);
if(d>1&&c.d*c.h>=G.hp[0]+(c.p?0:G.sh[0]))v+=99;if(d>1&&c.c==e)v*=1.25;
return v<=0?-1:v/(c.c+.5)+Math.random()*(d>1?.1:1.2)};
async function ai(){for(let n=0;n<9;n++){const e=G.en[1],ops=G.hd[1].map((id,k)=>({k,c:CD[id]})).filter(x=>x.c.c<=e);ops.forEach(x=>x.sc=sc(x.c));ops.sort((a,b)=>b.sc-a.sc);const b=ops[0];
if(!b||b.sc<0||(!G.diff&&n>1&&Math.random()<.3))break;await W(500);await playCard(1,b.k,true);if(chk())return;await W(300)}
await startTurn(0)}
/* ===== Soal & jawaban ===== */
const qOpen=q=>{Q=q;ov(`<div class=pn><h3>${SN[q.s]} · ${q.t.n}</h3><p class=qt>${q.q}</p><p class=rk>${q.mode=='play'?risk(CD[q.cid]):'Soal latihan: tidak memengaruhi pertarungan.'}</p><input id=ans inputmode=decimal autocomplete=off placeholder="Tulis jawabanmu di sini"><p id=msg></p><div class=bt><button class="b s" data-a=cancel>BATAL</button><button class=b data-a=ans>JAWAB</button></div></div>`,'top');setTimeout(()=>$('ans')?.focus(),60)};
function rec(q,ok){const t=SV.t[q.t.n]=SV.t[q.t.n]||[0,0];t[ok?0:1]++;SV[ok?'c':'x']++;SV.xp+=ok?10:4;if(q.mode=='play'&&G){G[ok?'ok':'bad']++;G[ok?'lt':'wr'][q.t.n]=1}save()}
function ans(){const q=Q;if(!q||q.lk)return;const v=$('ans').value.trim().replace(',','.').replace('−','-');
if(v===''||isNaN(+v)){$('msg').textContent='Tulis jawaban berupa angka dulu ya.';return}
q.lk=1;const ok=Math.abs(+v-q.a)<1e-6;rec(q,ok);closeOv();
if(q.mode=='play')resolve(q,ok,v).catch(()=>{});
else if(ok){snd('ok');LQ=q;ov(`<div class=pn><h3>JAWABAN BENAR</h3><p class=qt>Tepat! Kamu sudah paham materi ini.</p><div class=bt><button class="b s" data-a=sim>SOAL LAIN</button><button class=b data-a=cont>${q.lbl}</button></div></div>`,'top')}
else{snd('bad');learn(q,v)}}
async function resolve(q,ok,v){await playCard(0,q.k,ok);if(ok){snd('ok');toast('Tepat! Kartu berhasil diaktifkan.');q.fin()}else{await W(400);learn(q,v)}}
function learn(q,v){LQ=q;ov(`<div class=pn><h3>WAKTU BELAJAR</h3><h4>${SN[q.s]} · ${q.t.n}</h4><p class=qt>${q.q}</p><p>Jawabanmu: <b class=bd>${v}</b> · Jawaban yang benar: <b class=gd>${q.a}</b></p><p>${q.t.k}</p><p>Rumus: <code>${q.t.f}</code></p><ol>${q.st.map(x=>`<li>${x}</li>`).join('')}</ol><p><b>Kesimpulan:</b> jawabannya adalah ${q.a}.</p><p class=rk>Belum tepat. Pelajari langkahnya, lalu coba lagi pada soal berikutnya.</p><div class=bt><button class="b s" data-a=sim>COBA SOAL SERUPA</button><button class=b data-a=cont>${q.lbl}</button></div></div>`,'top')}
function finish(){const w=G.hp[1]<=0,wr=Object.keys(G.wr),lt=Object.keys(G.lt);SV.m++;if(w)SV.w++;SV.xp+=w?30:10;save();snd(w?'win':'lose');
ov(`<div class="pn ${w?'w':'l'}"><h3>${w?'KEMENANGAN':'KEKALAHAN'}</h3><p class=qt>${w?'Kamu menaklukkan Baron Nol!':'Belum berhasil kali ini, tetapi kamu sudah belajar.'}</p><p>Jawaban benar: <b class=gd>${G.ok}</b> · Jawaban belum tepat: <b class=bd>${G.bad}</b> · Putaran: ${G.rd}</p><p>${lt.length?'Materi yang kamu kuasai: '+lt.join(', ')+'.':''}</p><p>${wr.length?'Materi untuk diulang: '+wr.join(', ')+'.':'Semua soal kamu jawab dengan tepat!'}</p><div class=bt><button class="b s" data-a=menu>MENU UTAMA</button><button class=b data-a=start data-v=${G.diff}>${w?'MAIN LAGI':'COBA LAGI'}</button></div></div>`,'mid'+(w?' win':''))}
/* ===== Tampilan & navigasi ===== */
function ov(h,p='top'){$('ov').className=p;$('ov').innerHTML='<div class=bk></div>'+h}
const closeOv=()=>{$('ov').className='';$('ov').innerHTML=''};
const cf=(m,f)=>{CF=f;ov(`<div class=pn><h3>Konfirmasi</h3><p>${m}</p><div class=bt><button class="b s" data-a=x>BATAL</button><button class=b data-a=yes>YA</button></div></div>`,'mid')};
const help=()=>ov(`<div class=pn><h3>CARA BERMAIN</h3><ol><li>Kamu dan lawan punya 30 HP. Habiskan HP lawan untuk menang.</li><li>Setiap giliran kamu mendapat energi dan menarik satu kartu.</li><li>Pilih kartu, tekan <b>GUNAKAN KARTU</b>, lalu jawab soal matematikanya.</li><li>Jawaban benar membuat kartu bekerja penuh. Jawaban belum tepat membuat efek melemah atau gagal, dan kamu mendapat pembahasan.</li><li><b>BATAL</b> mengembalikan kartu tanpa mengurangi energi.</li><li>Tekan <b>AKHIRI GILIRAN</b> jika energi atau kartumu sudah cukup.</li></ol><p class=nt>Perisai hilang di awal gilirannya sendiri. Kartu Serangan, Pertahanan, dan Pemulihan bekerja separuh jika jawaban salah. Kartu Pengetahuan dan Khusus tidak berefek jika jawaban salah.</p><div class=bt><button class=b data-a=x>MENGERTI</button></div></div>`,'mid');
const apply=()=>document.body.classList.toggle('noanim',!SV.anim);
const set=()=>{apply();ov(`<div class=pn><h3>PENGATURAN</h3><p>Suara: <button class="b s" data-a=tg data-v=snd>${SV.snd?'NYALA':'MATI'}</button></p><p>Animasi: <button class="b s" data-a=tg data-v=anim>${SV.anim?'PENUH':'DIKURANGI'}</button></p><p class=nt>Animasi dikurangi membuat permainan lebih ringan.</p><div class=bt><button class="b s" data-a=rst>HAPUS PROGRES</button><button class=b data-a=x>TUTUP</button></div></div>`,'mid')};
const go=id=>{document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id==id));({char:rChar,diff:rDiff,lib:rLib,prog:rProg}[id]||(()=>{}))()};
const rChar=()=>$('char').innerHTML=`<h2>Pilih Karakter</h2><div class=row>${Object.keys(HR).map(k=>`<div class="hc${P.hero==k?' sel':''}" data-a=hero data-v=${k}><div class=hv>${AV(k)}</div><b>${HR[k].nm}</b><p>${HR[k].ds}</p></div>`).join('')}</div><p class=nt>Karakter hanya mengubah penampilan, bukan kekuatan.</p><div class=row><button class="b s" data-a=go data-v=menu>KEMBALI</button><button class=b data-a=go data-v=diff>PILIH KARAKTER</button></div>`;
const DD=['MUDAH|Lawan memilih kartu hampir acak.','SEDANG|Lawan menghitung serangan, pertahanan, dan energi.','SULIT|Lawan menghemat energi dan mencari kesempatan menang.'];
const rDiff=()=>$('diff').innerHTML=`<h2>Pilih Tingkat Kesulitan</h2><div class=row>${DD.map((x,i)=>`<div class=hc><button class=b data-a=start data-v=${i}>${x.split('|')[0]}</button><p>${x.split('|')[1]}</p></div>`).join('')}</div><button class="b s" data-a=go data-v=char>KEMBALI</button>`;
const rLib=()=>$('lib').innerHTML=`<h2>Perpustakaan Materi</h2><button class="b s" data-a=go data-v=menu>KEMBALI</button>`+S.map((g,s)=>`<h3 class=sh>Tahap ${s+1}: ${SN[s]}</h3><p class=nt style="align-self:flex-start">Kartu terkait: ${CD.filter(c=>c.tp==s).map(c=>c.n).join(', ')}</p><div class=gr>${g.map((t,i)=>{const[q,a,st]=t.g();return `<div class=tc><b>${t.n}</b><p>${t.k}</p><code>${t.f}</code><details><summary>Contoh soal</summary><p>${q} <b>Jawaban: ${a}</b></p><ol>${st.map(x=>`<li>${x}</li>`).join('')}</ol></details><small>Status: ${mst(t.n)}</small><button class="b s" data-a=prac data-v=${s},${i}>LATIH MATERI INI</button></div>`}).join('')}</div>`).join('');
const rProg=()=>{const tot=SV.c+SV.x,A=S.flat(),tr=n=>SV.t[n.n]||[0,0],ch=a=>a.length?a.map(t=>`<code>${t.n}</code>`).join(' '):'<span class=nt>Belum ada.</span>';
$('prog').innerHTML=`<h2>Progres Belajar</h2><button class="b s" data-a=go data-v=menu>KEMBALI</button><div class=st><div><b>${SV.m}</b>Pertandingan</div><div><b>${SV.w}</b>Kemenangan</div><div><b>${SV.c}</b>Jawaban benar</div><div><b>${SV.x}</b>Jawaban belum tepat</div><div><b>${tot?Math.round(SV.c*100/tot):0}%</b>Ketepatan</div><div><b>${1+(SV.xp/100|0)}</b>Tingkat (${SV.xp} XP)</div></div><div class=tc style="width:min(800px,100%)"><b>Materi yang sering salah</b><p>${ch(A.filter(t=>tr(t)[1]>0).sort((a,b)=>tr(b)[1]-tr(a)[1]).slice(0,6))}</p><b>Materi yang perlu diulang</b><p>${ch(A.filter(t=>mst(t.n)=='Perlu diulang'))}</p><b>Materi yang sudah dipelajari (${A.filter(t=>tr(t)[0]+tr(t)[1]>0).length} dari ${A.length})</b><p>${ch(A.filter(t=>tr(t)[0]+tr(t)[1]>0))}</p></div><p class=nt>Kamu tetap mendapat pengalaman belajar saat menjawab salah dan mempelajari pembahasannya.</p>`};
/* ===== Aksi ===== */
const A={go,help,set,x:closeOv,sim(){qOpen({...genQ(LQ.s,LQ.i),mode:'prac',fin:LQ.fin,back:LQ.fin,lbl:LQ.lbl})},
hero(v){P.hero=v;rChar()},start(v){DF=+v;startGame()},
tg(v){SV[v]=SV[v]?0:1;save();set()},
pick(v){if(G.busy||G.turn)return;const k=+v,c=CD[G.hd[0][k]];if(c.c>G.en[0]){toast('Energi tidak cukup untuk kartu ini.');snd('bad');return}G.sel=G.sel==k?-1:k;snd('sel');render()},
use(){if(G.busy||G.turn||G.sel<0)return;const c=CD[G.hd[0][G.sel]];G.busy=true;qOpen({...genQ(c.tp),mode:'play',k:G.sel,cid:c.id,lbl:'LANJUTKAN PERTARUNGAN',back:()=>{G.busy=false;render()},fin:()=>{if(!chk()){G.busy=false;render()}}})},
end(){if(G.busy||G.turn)return;G.busy=true;G.sel=-1;render();startTurn(1).catch(()=>{})},
ans,cancel(){closeOv();Q&&Q.back&&Q.back()},cont(){closeOv();LQ.fin()},
prac(v){const[s,i]=v.split(',').map(Number),n=()=>{};qOpen({...genQ(s,i),mode:'prac',fin:n,back:n,lbl:'TUTUP'})},
log(){ov(`<div class=pn><h3>CATATAN PERTEMPURAN</h3>${G.lg.slice(-14).reverse().map(x=>`<p>${x}</p>`).join('')||'<p>Belum ada kejadian.</p>'}<div class=bt><button class=b data-a=x>TUTUP</button></div></div>`,'mid')},
quit(){cf('Menyerah dan kembali ke menu utama? Pertandingan ini tidak dihitung.',()=>{EP++;closeOv();go('menu')})},
menu(){EP++;closeOv();go('menu')},yes(){CF&&CF()},
rst(){cf('Hapus semua progres belajar?',()=>{Object.assign(SV,{m:0,w:0,c:0,x:0,xp:0,t:{}});save();set()})}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.v,t)});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='ans')ans()});
$('deco').innerHTML=[...'+−×÷=π√∑ƒ²%x'].map(c=>`<span style="left:${r(2,96)}%;animation-delay:-${r(0,12)}s;font-size:${r(18,48)}px">${c}</span>`).join('')+[3,8,16].map((c,i)=>`<div class="dc d${i}">${CH(CD[c])}</div>`).join('');
apply();
</script></body></html>
